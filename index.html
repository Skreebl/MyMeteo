<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Архів прогнозів погоди</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--fg:#1c2430;--mut:#6b7686;--line:#dde2ea;--acc:#1a73e8;--accfg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--fg:#e8ecf1;--mut:#8f9aab;--line:#2c3541;--acc:#5b9dff;--accfg:#0b1220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 12px 8px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:16px;margin:0 auto 0 0}
.btn{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.btn.on{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
#days{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:thin}
.day{flex:none;width:52px;padding:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;font:inherit;cursor:pointer}
.day small{font-size:11px;color:var(--mut)}
.day b{font-size:17px}
.day.off{opacity:.35;cursor:default}
.day.now{border-color:var(--acc)}
.day.sel{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
.day.sel small{color:inherit}
main{padding:12px;display:grid;gap:12px}
.sc{user-select:none;-webkit-user-select:none}
.sc img{-webkit-user-drag:none}
main.windguru .sc{cursor:grab}
main .sc.grab{cursor:grabbing}
.grp{display:flex;gap:6px;align-items:center;color:var(--mut)}
.btn:disabled{opacity:.35;cursor:default}
.day.in{background:color-mix(in srgb,var(--acc) 18%,var(--bg))}
#cal{position:absolute;top:100%;left:12px;z-index:10;width:min(320px,calc(100vw - 24px));margin-top:-4px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;text-transform:capitalize}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cg span{font-size:11px;color:var(--mut)}
.cd{aspect-ratio:1;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
.cd.off{opacity:.3;cursor:default}
.cd.now{border-color:var(--acc)}
.cd.sel{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
@media (max-width:700px){header{position:relative}}
.p{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.ph{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.ph span{color:var(--mut)}
.sc{overflow-x:auto}
.sc img{display:block}
main.ipma .sc img{width:100%;height:auto}
main.windguru .sc img{max-width:none}
.none,#msg{padding:40px 16px;text-align:center;color:var(--mut)}
.none a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Архів прогнозів</h1>
    <button class="btn" data-src="windguru">Windguru</button>
    <button class="btn" data-src="ipma">IPMA</button>
  </div>
  <div class="bar" style="margin-top:8px">
    <button class="btn" id="calBtn">📅 Календар</button>
    <span class="grp">Днів:
      <button class="btn" data-n="2">2</button>
      <button class="btn" data-n="3">3</button>
      <button class="btn" data-n="4">4</button>
    </span>
    <button class="btn" id="lay" title="Розкладка"></button>
  </div>
  <div id="days"></div>
  <div id="cal" hidden></div>
</header>
<main id="view"><div id="msg">Завантаження…</div></main>

<script>
// Репозиторій, ЗВІДКИ беруться знімки. Може бути іншим, ніж той, де лежить сам сайт.
// owner/repo — власник і назва (репозиторій має бути публічним);
// ref — гілка (HEAD = гілка за замовчуванням);
// prefix — підпапка, де лежать каталоги windguru/ та ipma/ (порожньо = корінь).
const CFG = { owner: 'Skreebl', repo: 'MyMeteo', ref: 'HEAD', prefix: '' };

const $ = s => document.querySelector(s);
const store = {
  get: k => { try { return localStorage.getItem('wa.' + k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem('wa.' + k, v); } catch (e) {} }
};
const LAYOUTS = { auto: 'Розкладка: авто', side: 'Розкладка: поруч', stack: 'Розкладка: одне під одним' };
const state = {
  src: 'windguru', day: null,
  layout: LAYOUTS[store.get('layout')] ? store.get('layout') : 'auto',
  n: [2, 3, 4].includes(+store.get('n')) ? +store.get('n') : 2
};
let calMonth = '';
let data = { windguru: {}, ipma: {} };

const shift = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const fmt = (d, o) => new Intl.DateTimeFormat('uk-UA', { timeZone: 'UTC', ...o }).format(new Date(d + 'T00:00:00Z'));
const today = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`; };
const rel = d => { const t = today(); return d === t ? 'Сьогодні' : d === shift(t, -1) ? 'Вчора' : d === shift(t, -2) ? 'Позавчора' : ''; };

function repoInfo() {
  if (CFG.owner && CFG.repo) return CFG;
  const m = location.hostname.match(/^(.+)\.github\.io$/);
  if (!m) return null;
  const seg = location.pathname.split('/')[1] || '';
  return { ...CFG, owner: m[1], repo: seg && !seg.includes('.') ? seg : location.hostname };
}

async function loadTree() {
  const info = repoInfo();
  if (!info) throw new Error('Не вдалося визначити репозиторій. Впишіть owner і repo у CFG.');
  const key = `wa:${info.owner}/${info.repo}`;
  try {
    const c = JSON.parse(sessionStorage.getItem(key) || 'null');
    if (c && Date.now() - c.t < 3e5) return c.paths;
  } catch (e) {}
  const r = await fetch(`https://api.github.com/repos/${info.owner}/${info.repo}/git/trees/${info.ref}?recursive=1`);
  if (!r.ok) throw new Error(`GitHub API: ${r.status}. Ліміт запитів або репозиторій приватний.`);
  const paths = (await r.json()).tree.filter(t => t.type === 'blob').map(t => t.path);
  try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), paths })); } catch (e) {}
  return paths;
}

function index(paths) {
  const re = /^(windguru|ipma)\/(\d{4}-\d{2}-\d{2})[ T_](\d{2})[:_.-](\d{2})[:_.-](\d{2})_(?:windguru|ipma)\.png$/;
  const info = repoInfo();
  const pre = CFG.prefix ? CFG.prefix.replace(/^\/+|\/+$/g, '') + '/' : '';
  for (const full of paths) {
    if (!full.startsWith(pre)) continue;
    const p = full.slice(pre.length);
    const m = p.match(re);
    if (!m) continue;
    const [, src, date, hh, mi, ss] = m;
    const time = `${hh}:${mi}:${ss}`;
    const file = encodeURIComponent(p.slice(src.length + 1));
    const url = `https://raw.githubusercontent.com/${info.owner}/${info.repo}/${info.ref}/${pre}${src}/${file}`;
    (data[src][date] = data[src][date] || []).push({ time, url, local: `${pre}${src}/${file}` });
  }
  for (const s in data) for (const d in data[s]) data[s][d].sort((a, b) => a.time.localeCompare(b.time));
}

function dayList(src) {
  const ks = Object.keys(data[src]).sort();
  if (!ks.length) return [];
  const out = [];
  for (let d = ks[0]; d <= ks[ks.length - 1]; d = shift(d, 1)) out.push(d);
  return out;
}

const has = (src, d) => !!(data[src][d] && data[src][d].length);

function panel(d, fallback) {
  const s = (data[state.src][d] || []).slice(-1)[0];
  const label = rel(d) || fallback;
  const head = `<div class="ph"><b>${label}</b><span>${fmt(d, { weekday: 'short', day: 'numeric', month: 'long' })}${s ? ' · станом на ' + s.time.slice(0, 5) : ''}</span></div>`;
  const body = s
    ? `<div class="sc"><img src="${s.url}" data-raw="${s.url}" data-alt="${s.local}" alt="Прогноз ${d}" draggable="false" onerror="imgFail(this)"></div>`
    : `<div class="none">Немає знімків за цей день</div>`;
  return `<section class="p">${head}${body}</section>`;
}

function render() {
  const src = state.src, days = dayList(src);
  document.querySelectorAll('[data-src]').forEach(b => b.classList.toggle('on', b.dataset.src === src));
  document.querySelectorAll('[data-n]').forEach(b => b.classList.toggle('on', +b.dataset.n === state.n));
  $('#lay').textContent = LAYOUTS[state.layout];
  if (!days.length) { $('#view').className = ''; $('#view').innerHTML = '<div id="msg">Для цього джерела ще немає знімків.</div>'; $('#days').innerHTML = ''; return; }
  if (!state.day || !has(src, state.day)) state.day = days.filter(d => has(src, d)).pop();
  const t = today();
  $('#days').innerHTML = days.map(d =>
    `<button class="day${has(src, d) ? '' : ' off'}${d === state.day ? ' sel' : ''}${d < state.day && d >= shift(state.day, 1 - state.n) ? ' in' : ''}${d === t ? ' now' : ''}" data-d="${d}" ${has(src, d) ? '' : 'disabled'}>` +
    `<small>${fmt(d, { weekday: 'short' })}</small><b>${+d.slice(8)}</b><small>${fmt(d, { month: 'short' })}</small></button>`).join('');
  const sel = $('.day.sel');
  if (sel) sel.scrollIntoView({ inline: 'center', block: 'nearest' });
  const n = state.n;
  const side = state.layout === 'side' || (state.layout === 'auto' && src === 'ipma' && innerWidth >= 400 * n);
  const v = $('#view');
  v.className = src + (side ? ' side' : '');
  v.style.gridTemplateColumns = side ? `repeat(${n}, minmax(0, 1fr))` : '';
  v.innerHTML = Array.from({ length: n }, (_, i) => panel(shift(state.day, -i), i === 0 ? 'Вибраний день' : 'Раніше')).join('');
  syncScroll();
  if (!$('#cal').hidden) renderCal();
  history.replaceState(null, '', `#${src}/${state.day}`);
}

async function imgFail(img) {
  if (!img.dataset.tried) { img.dataset.tried = '1'; img.src = img.dataset.alt; return; }
  const box = img.closest('.sc');
  let st = 'мережа недоступна';
  try { st = 'HTTP ' + (await fetch(img.dataset.raw, { method: 'HEAD' })).status; } catch (e) {}
  box.innerHTML = `<div class="none">Не вдалося завантажити зображення (${st}).<br><a href="${img.dataset.raw}" target="_blank" rel="noopener">raw</a> · <a href="${img.dataset.alt}" target="_blank">pages</a></div>`;
}

function syncScroll() {
  const sc = [...document.querySelectorAll('.sc')];
  let lock = false;
  sc.forEach(a => a.addEventListener('scroll', () => {
    if (lock) return;
    lock = true;
    sc.forEach(b => { if (b !== a) b.scrollLeft = a.scrollLeft; });
    requestAnimationFrame(() => lock = false);
  }));
}

function step(n) {
  const ds = dayList(state.src).filter(d => has(state.src, d));
  const i = ds.indexOf(state.day) + n;
  if (i >= 0 && i < ds.length) { state.day = ds[i]; render(); }
}

const addMonth = (ym, n) => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m - 1 + n, 1)).toISOString().slice(0, 7); };

function renderCal() {
  const days = dayList(state.src);
  if (!days.length) return;
  const minM = days[0].slice(0, 7), maxM = days[days.length - 1].slice(0, 7), t = today();
  const [y, m] = calMonth.split('-').map(Number);
  const lead = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7;
  const dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
  let cells = '<i></i>'.repeat(lead);
  for (let i = 1; i <= dim; i++) {
    const ds = `${calMonth}-${String(i).padStart(2, '0')}`, ok = has(state.src, ds);
    cells += `<button class="cd${ok ? '' : ' off'}${ds === state.day ? ' sel' : ''}${ds === t ? ' now' : ''}" data-cd="${ds}" ${ok ? '' : 'disabled'}>${i}</button>`;
  }
  $('#cal').innerHTML =
    `<div class="ch"><button class="btn" data-cm="-1" ${calMonth <= minM ? 'disabled' : ''}>‹</button><b>${fmt(calMonth + '-01', { month: 'long', year: 'numeric' })}</b><button class="btn" data-cm="1" ${calMonth >= maxM ? 'disabled' : ''}>›</button></div>` +
    `<div class="cg">${['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'].map(x => `<span>${x}</span>`).join('')}${cells}</div>`;
}

function toggleCal(open) {
  const c = $('#cal');
  if (!state.day) return;
  const show = open ?? c.hidden;
  c.hidden = !show;
  if (show) { calMonth = state.day.slice(0, 7); renderCal(); }
}

document.addEventListener('click', e => {
  const t = e.target;
  const b = t.closest('[data-src]'), d = t.closest('.day[data-d]'), n = t.closest('[data-n]');
  const cm = t.closest('[data-cm]'), cd = t.closest('[data-cd]');
  if (cm) { if (!cm.disabled) { calMonth = addMonth(calMonth, +cm.dataset.cm); renderCal(); } return; }
  if (cd) { if (!cd.disabled) { state.day = cd.dataset.cd; toggleCal(false); render(); } return; }
  if (t.closest('#calBtn')) { toggleCal(); return; }
  if (!t.closest('#cal')) toggleCal(false);
  if (b) { state.src = b.dataset.src; render(); }
  if (d && !d.disabled) { state.day = d.dataset.d; render(); }
  if (n) { state.n = +n.dataset.n; store.set('n', state.n); render(); }
  if (t.closest('#lay')) {
    const k = Object.keys(LAYOUTS);
    state.layout = k[(k.indexOf(state.layout) + 1) % k.length];
    store.set('layout', state.layout);
    render();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') toggleCal(false);
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

// Перетягування зображення мишею (дотик і повзунок працюють як раніше)
let drag = null;
document.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  const sc = e.target.closest('.sc');
  if (!sc || sc.scrollWidth <= sc.clientWidth) return;
  if (e.offsetY > sc.clientHeight) return; // клік по повзунку не перехоплюємо
  drag = { sc, x: e.clientX, left: sc.scrollLeft };
  sc.classList.add('grab');
  e.preventDefault();
});
document.addEventListener('pointermove', e => { if (drag) drag.sc.scrollLeft = drag.left - (e.clientX - drag.x); });
const endDrag = () => { if (drag) { drag.sc.classList.remove('grab'); drag = null; } };
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
document.addEventListener('dragstart', e => { if (e.target.closest && e.target.closest('.sc')) e.preventDefault(); });
let lastW = innerWidth;
addEventListener('resize', () => {
  if (innerWidth === lastW) return;
  lastW = innerWidth;
  if (state.layout === 'auto') render();
});

(async () => {
  try {
    index(await loadTree());
    const m = location.hash.match(/^#(windguru|ipma)\/(\d{4}-\d{2}-\d{2})$/);
    if (m) { state.src = m[1]; state.day = m[2]; }
    render();
  } catch (err) {
    $('#view').innerHTML = `<div id="msg">${err.message}</div>`;
  }
})();
</script>
</body>
</html>
